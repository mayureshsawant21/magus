name: Publish to GitHub Pages

# Rebuilds the site whenever content, uploads or code change, including every
# Save from the admin panel (each save is a commit).
on:
  push:
    branches: [claude/loving-fermi-21bo0z, main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static site
        # optional: a SITE_PASSWORD repository secret re-encrypts the content on every build
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node scripts/export-static.js
      # If Settings → Pages → Source is still "Deploy from a branch", GitHub also publishes the raw
      # repository (the README) on every push. Wait for that build so this deploy lands last.
      - name: Wait for GitHub's branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          for i in $(seq 1 40); do
            pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.path | startswith("dynamic/pages")) | select(.status != "completed")] | length' || echo 0)
            [ "$pending" = "0" ] && break
            echo "Branch build still running…"; sleep 10
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
